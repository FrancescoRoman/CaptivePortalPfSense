<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione Wi-Fi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4A90E2, #9013FE);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 1.5s ease-in-out;
        }
        input, button {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        button {
            background: #FF4081;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #E91E63;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .back-link {
            margin-top: 15px;
            font-size: 14px;
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crea un nuovo account</h1>
        <p>Compila i campi per registrarti alla rete Wi-Fi</p>
        <form action="/register_user.php" method="post">
            <input type="text" name="username" placeholder="Scegli un nome utente" required><br>
            <input type="password" name="password" placeholder="Scegli una password" required><br>
            <button type="submit">Registrati</button>
        </form>
       
    </div>
</body>
</html>
